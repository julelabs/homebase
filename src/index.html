<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flur">
<title>Flur</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #F6F1E7;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  button, input, textarea, select {
    font-family: inherit;
  }

  :root {
    --bg: #F6F1E7;
    --card: #FFFDF8;
    --text: #2B2A28;
    --text2: #6B6660;
    --line: #E3DCCF;
  }
  #app.night, #own-overlay.night {
    /* Nacht: dunkles Blau statt Braun, Karten eine Stufe heller als der Grund */
    --bg: #141923;
    --card: #1D2432;
    --text: #E8ECF2;
    --text2: #98A3B5;
    --line: #354256;
    --ic-salbei: #7E937C; --ic-staubblau: #73899E; --ic-sand: #AE9871; --ic-mauve: #927D91; --ic-terrakotta: #A57E6B;
    --ic-olive: #888A5A; --ic-schiefer: #737D88; --ic-rose: #A98487; --ic-petrol: #688985; --ic-ocker: #A48A50; --ic-weiss: #4A5364; --av-eye: #EEF1F5;
  }
  :root {
    --ic-salbei: #9DB59A; --ic-staubblau: #8FA9C2; --ic-sand: #D4B98A; --ic-mauve: #B59BB3; --ic-terrakotta: #C99A83;
    --ic-olive: #A8A96E; --ic-schiefer: #8E9AA6; --ic-rose: #D0A3A6; --ic-petrol: #7FA8A4; --ic-ocker: #C9A961; --ic-weiss: #FFFDF8; --av-eye: #FFFDF8;
  }

  #app {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    transition: background 400ms ease, color 400ms ease;
  }

  .icon-svg {
    width: 100%;
    height: 100%;
    display: block;
    fill: none;
    stroke: currentColor;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  /* Stil A: Hauptform in Aufgabenfarbe, Nebenformen in Kartenfarbe, Linien in Textfarbe */
  svg.ic-a { stroke: var(--text); stroke-width: 2.5; }
  svg.ic-a .p { fill: currentColor; }
  svg.ic-a .s { fill: var(--card); }
  svg.ic-a .k { fill: var(--text); stroke: none; }
  svg.ic-a.ic-salbei { color: var(--ic-salbei); } svg.ic-a.ic-staubblau { color: var(--ic-staubblau); }
  svg.ic-a.ic-sand { color: var(--ic-sand); } svg.ic-a.ic-mauve { color: var(--ic-mauve); }
  svg.ic-a.ic-terrakotta { color: var(--ic-terrakotta); } svg.ic-a.ic-olive { color: var(--ic-olive); }
  svg.ic-a.ic-schiefer { color: var(--ic-schiefer); } svg.ic-a.ic-rose { color: var(--ic-rose); }
  svg.ic-a.ic-petrol { color: var(--ic-petrol); } svg.ic-a.ic-ocker { color: var(--ic-ocker); }
  svg.ic-a.ic-weiss { color: var(--ic-weiss); }
  /* Avatare: Kreis in Kind-Farbe, Augen hell, Linien in Textfarbe */
  svg.av-a { stroke: var(--text); stroke-width: 2.2; color: var(--accent, var(--text2)); }
  svg.av-a .bg { fill: currentColor; stroke: none; }
  svg.av-a .p { }
  svg.av-a .s { fill: var(--av-eye); }
  svg.av-a .k { fill: var(--text); stroke: none; }

  /* ---------- Kopfzeile ---------- */
  #header {
    flex: 0 0 96px;
    height: 96px;
    display: flex;
    align-items: center;
    padding: 0 24px;
    border-bottom: 1px solid var(--line);
  }
  #header .phase-icon {
    width: 30px;
    height: 30px;
    color: var(--text2);
    margin-right: 14px;
    flex: 0 0 auto;
  }
  #header .date-text {
    font-size: 22px;
    color: var(--text2);
    flex: 0 0 auto;
    white-space: nowrap;
    margin-right: 24px;
  }
  #header .message-text {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 30px;
    font-weight: 600;
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---------- Board ---------- */
  #board {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  .column {
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
  }
  .column.col-2 {
    border-left: 1px solid var(--line);
  }
  .col-head {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    padding: 18px 24px;
  }
  .col-head .avatar {
    width: 72px;
    height: 72px;
    margin-right: 16px;
    flex: 0 0 auto;
  }
  .col-head .kid-name {
    font-size: 32px;
    font-weight: 700;
    color: var(--accent);
  }
  .col-body {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 4px 16px 24px 16px;
  }

  /* ---------- Icon-Tiles (literacy: icons) ---------- */
  .task-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-gap: 14px;
  }
  .tile {
    position: relative;
    min-height: 150px;
    background: var(--card);
    border-radius: 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 14px 10px;
    transition: opacity 300ms ease, transform 100ms ease;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  .tile.pressed { transform: scale(0.97); background: var(--line); }
  .tile.done { opacity: 0.45; }
  #app.night .tile.done, #app.night .task-row.done { opacity: 0.55; }
  .tile, .task-row, .done-view { cursor: pointer; }
  .tile * , .task-row * { pointer-events: none; }
  .tile .tile-icon {
    width: 80px;
    height: 80px;
    color: var(--text);
    margin-bottom: 8px;
  }
  .tile .tile-label {
    font-size: 18px;
    color: var(--text2);
    text-align: center;
  }
  .tile .tile-check {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 40px;
    height: 40px;
  }
  .tile.add-own {
    border: 3px dashed var(--line);
    background: transparent;
  }
  .tile.add-own .plus-sign {
    font-size: 48px;
    line-height: 1;
    color: var(--text2);
    margin-bottom: 4px;
  }

  /* ---------- Zeilen (literacy: text) ---------- */
  .task-list { display: flex; flex-direction: column; }
  .task-row {
    position: relative;
    min-height: 92px;
    display: flex;
    align-items: center;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    transition: opacity 300ms ease, transform 100ms ease;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  .task-row.pressed { transform: scale(0.98); }
  .task-row.done { opacity: 0.45; }
  .task-row .row-icon {
    width: 56px;
    height: 56px;
    color: var(--text);
    margin-right: 20px;
    flex: 0 0 auto;
  }
  .task-row .row-label {
    font-size: 28px;
    flex: 1 1 auto;
    min-width: 0;
  }
  .task-row .row-check {
    width: 48px;
    height: 48px;
    flex: 0 0 auto;
    margin-left: 16px;
  }
  .task-row.add-own {
    border: 3px dashed var(--line);
    border-radius: 18px;
    margin-top: 8px;
  }
  .task-row.add-own .plus-sign {
    font-size: 40px;
    line-height: 1;
    color: var(--text2);
    margin-right: 20px;
    width: 56px;
    text-align: center;
  }
  .task-row.add-own .row-label { color: var(--text2); }

  /* ---------- Haken ---------- */
  .check {
    display: block;
    width: 100%;
    height: 100%;
  }
  .check-circle {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: 3px solid var(--line);
  }
  .checked .check-circle {
    background: var(--accent);
    border-color: var(--accent);
  }
  .checked .check-circle svg { width: 60%; height: 60%; }
  .check-circle svg { display: none; width: 60%; height: 60%; }
  .checked .check-circle svg { display: block; }
  @keyframes popIn {
    0% { transform: scale(0); }
    60% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  .pop .check-circle { animation: popIn 350ms cubic-bezier(.34,1.56,.64,1); }

  /* ---------- Fertig / leer ---------- */
  .done-view, .empty-view {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    touch-action: manipulation;
  }
  @keyframes fadeInSoft { from { opacity: 0; } to { opacity: 1; } }
  .done-view { animation: fadeInSoft 400ms ease; }
  .done-view .done-avatar { width: 100px; height: 100px; margin-bottom: 18px; }
  .done-view .done-phase-icon { width: 56px; height: 56px; color: var(--accent); margin-bottom: 14px; }
  .done-view .done-text { font-size: 36px; font-weight: 600; color: var(--text); }
  .empty-view .empty-icon { width: 48px; height: 48px; color: var(--text2); margin-bottom: 14px; }
  .empty-view .empty-text { font-size: 22px; color: var(--text2); }

  /* ---------- Ecke fürs Eltern-Overlay ---------- */
  .corner-hit {
    position: fixed;
    top: 0; right: 0;
    width: 140px;
    height: 140px;
    z-index: 40;
    background: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  .corner-hit::after {
    content: '';
    position: absolute;
    top: 16px; right: 16px;
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 3px solid var(--text2);
    opacity: 0;
    -webkit-transform: scale(0.4);
    transform: scale(0.4);
    transition: opacity 2.6s ease 0.3s, -webkit-transform 2.6s ease 0.3s;
    transition: opacity 2.6s ease 0.3s, transform 2.6s ease 0.3s;
  }
  .corner-hit.arming::after {
    opacity: 0.45;
    -webkit-transform: scale(1);
    transform: scale(1);
  }
  #app {
    -webkit-touch-callout: none;
  }

  /* ---------- Fehleranzeige (fuer das iPad ohne Konsole) ---------- */
  #error-toast {
    position: fixed;
    left: 12px; bottom: 12px;
    max-width: 70%;
    z-index: 95;
    font-size: 13px;
    line-height: 1.3;
    color: var(--text2);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 6px 10px;
    display: none;
    word-break: break-word;
  }
  #error-toast.show { display: block; }

  /* ---------- Simulationslabel ---------- */
  #sim-label {
    position: fixed;
    right: 14px;
    bottom: 10px;
    font-size: 13px;
    color: var(--text2);
    background: var(--card);
    padding: 4px 10px;
    border-radius: 10px;
    opacity: 0.85;
    z-index: 30;
    display: none;
  }

  /* Ladezustand bis zur ersten Serverantwort */
  #loading {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text2);
    font-size: 24px;
    z-index: 40;
  }

  /* Kurzer Hinweis, wenn eine Änderung nicht gespeichert werden konnte */
  #toast {
    position: fixed;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
    font-size: 15px;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--line);
    padding: 8px 14px;
    border-radius: 10px;
    z-index: 35;
    display: none;
  }

  /* Haken wartet auf Serverbestätigung */
  .tile.pending, .task-row.pending { opacity: 0.7; }

  /* ---------- Overlays allgemein ---------- */
  .overlay {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    z-index: 60;
    display: none;
    overflow: hidden;
  }
  .overlay.open { display: block; }
  .overlay-scrim {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    background: rgba(0,0,0,0.35);
  }
  .overlay-box {
    color: var(--text);
    position: relative;
    max-width: 760px;
    margin: 40px auto;
    background: var(--card);
    border-radius: 24px;
    padding: 30px;
    max-height: calc(100% - 80px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .overlay-title {
    font-size: 30px;
    font-weight: 700;
    margin: 0 0 20px 0;
    text-align: center;
  }
  .icon-pick-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-gap: 10px;
    margin-bottom: 20px;
  }
  .icon-pick {
    background: var(--bg);
    border: 3px solid transparent;
    border-radius: 16px;
    padding: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }
  .icon-pick svg { width: 52px; height: 52px; color: var(--text); }
  .icon-pick.selected { border-color: var(--text); }
  .own-input {
    width: 100%;
    font-size: 24px;
    padding: 14px 16px;
    border: 2px solid var(--line);
    border-radius: 14px;
    background: var(--bg);
    color: var(--text);
    margin-bottom: 22px;
  }
  .overlay-buttons { display: flex; flex-direction: row-reverse; }
  .btn-big {
    font-size: 22px;
    padding: 14px 26px;
    border-radius: 16px;
    border: none;
    margin-left: 14px;
    touch-action: manipulation;
  }
  .btn-primary { background: var(--text); color: var(--card); }
  .btn-secondary { background: var(--line); color: var(--text); }

  /* ---------- Elternbereich ---------- */
  #parent-overlay {
    z-index: 90;
  }
  .parent-root {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    background: #EDEAE3;
    color: #33312D;
    font-size: 17px;
    display: flex;
    flex-direction: row;
  }
  .parent-nav {
    flex: 0 0 200px;
    background: #E2DED4;
    display: flex;
    flex-direction: column;
    padding: 16px 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .parent-nav button {
    text-align: left;
    background: transparent;
    border: none;
    padding: 14px 20px;
    font-size: 16px;
    color: #33312D;
    border-left: 4px solid transparent;
  }
  .parent-nav button.active {
    background: #F8F7F4;
    border-left-color: #5B6B63;
    font-weight: 600;
  }
  .parent-nav .nav-spacer { flex: 1 1 auto; }
  .parent-nav .nav-back {
    border-top: 1px solid #D8D4CB;
    color: #5B6B63;
    font-weight: 600;
  }
  .parent-content {
    flex: 1 1 auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 26px 34px;
  }
  .parent-content h2 {
    font-size: 22px;
    margin: 0 0 6px 0;
  }
  .parent-content .p-hint {
    font-size: 14px;
    color: #726E66;
    margin: 6px 0 20px 0;
  }
  .p-field { margin-bottom: 18px; }
  .p-field label {
    display: block;
    font-size: 14px;
    color: #726E66;
    margin-bottom: 6px;
  }
  .p-field input[type="text"],
  .p-field input[type="time"],
  .p-field textarea,
  .p-field select {
    width: 100%;
    max-width: 480px;
    font-size: 16px;
    padding: 9px 12px;
    border: 1px solid #D8D4CB;
    border-radius: 8px;
    background: #F8F7F4;
    color: #33312D;
  }
  .p-row { display: flex; flex-wrap: wrap; margin: -4px; }
  .p-row > * { margin: 4px; }
  .p-btn {
    font-size: 15px;
    padding: 9px 16px;
    border-radius: 8px;
    border: 1px solid #C9C4B8;
    background: #F8F7F4;
    color: #33312D;
  }
  .p-btn.active { background: #5B6B63; color: #F8F7F4; border-color: #5B6B63; }
  .p-btn.primary { background: #5B6B63; color: #F8F7F4; border-color: #5B6B63; }
  .p-btn.warn { color: #A0522D; border-color: #C9A28C; }
  table.p-table { border-collapse: collapse; width: 100%; margin-bottom: 10px; }
  table.p-table th, table.p-table td {
    text-align: left;
    padding: 6px 10px;
    border-bottom: 1px solid #D8D4CB;
    font-size: 15px;
  }
  .p-swatch {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 3px solid transparent;
    display: inline-block;
  }
  .p-swatch.selected { border-color: #33312D; }
  .p-avatarpick { width: 44px; height: 44px; border-radius: 50%; border: 3px solid transparent; padding: 2px; background: #E2DED4; }
  .p-avatarpick svg { width: 100%; height: 100%; }
  .p-avatarpick.selected { border-color: #33312D; }
  .p-task-line { display: flex; align-items: center; padding: 8px 0; border-bottom: 1px solid #D8D4CB; }
  .p-task-line svg { width: 26px; height: 26px; color: #5B6B63; margin-right: 12px; flex: 0 0 auto; }
  .p-task-line .p-task-text { flex: 1 1 auto; }
  .p-task-line .p-task-text .short { color: #726E66; font-size: 13px; }
  .p-check-line { display: flex; align-items: center; padding: 5px 0; }
  .p-check-line input { margin-right: 10px; }
  .p-check-line svg { width: 22px; height: 22px; margin-right: 8px; color: #5B6B63; }

  @media (max-width: 620px) {
    .parent-nav { flex: 0 0 140px; }
    .parent-content { padding: 18px; }
  }
</style>
</head>

<script>
(function () {
  // Fehler sichtbar machen: kleine Zeile unten links, verschwindet nach 15 Sekunden
  var errorToastTimer = null;
  window.__errors = [];
  function showErrorToast(text) {
    try {
      window.__errors.push(text);
      if (window.__errors.length > 5) window.__errors.shift();
      var el = document.getElementById('error-toast');
      if (!el) return;
      el.textContent = 'Fehler: ' + text;
      el.className = 'show';
      if (errorToastTimer) clearTimeout(errorToastTimer);
      errorToastTimer = setTimeout(function () { el.className = ''; }, 15000);
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    var where = e.filename ? ' (' + String(e.filename).split('/').pop() + ':' + e.lineno + ')' : '';
    showErrorToast((e.message || 'unbekannt') + where);
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    showErrorToast('Promise: ' + (r && r.message ? r.message : String(r)));
  });

  "use strict";

  /* ============================================================
     Store
     ============================================================ */
  /* Alle Daten liegen in Postgres hinter der JSON-API (backend/). Kein localStorage.
     API-Adresse: ?api=... in der Adresse, sonst localhost:4000 am Rechner, sonst Fly.
     Optionales Token: ?token=... (Server mit API_TOKEN). Beides bleibt im Homescreen-Lesezeichen. */
  function urlParam(name) {
    try { return new URLSearchParams(location.search).get(name); } catch (e) { return null; }
  }

  var API_BASE = (function () {
    var override = urlParam('api');
    if (override) return override.replace(/\/$/, '');
    var local = location.protocol === 'file:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    return local ? 'http://localhost:4000' : 'https://homebase-api.fly.dev';
  })();
  var API_TOKEN = urlParam('token');

  var writeSeq = 0; // zählt Schreibvorgänge, damit überholte Poll-Antworten verworfen werden

  function wait(ms) { return new Promise(function (resolve) { setTimeout(resolve, ms); }); }

  // HTTP-Aufruf mit Wiederholung bei Netzfehlern und vorübergehenden Serverfehlern
  // (429, 502, 503, 504, zum Beispiel beim Aufwachen des Servers). Backoff 0,5s bis 8s.
  function apiRequest(method, path, body, attempts) {
    if (typeof attempts !== 'number') attempts = 5;
    var headers = { 'Accept': 'application/json' };
    if (body !== undefined) headers['Content-Type'] = 'application/json';
    if (API_TOKEN) headers['Authorization'] = 'Bearer ' + API_TOKEN;
    var opts = { method: method, headers: headers, cache: 'no-store' };
    if (body !== undefined) opts.body = JSON.stringify(body);
    var attempt = 0;

    function run() {
      attempt++;
      return fetch(API_BASE + path, opts).then(function (res) {
        if (res.ok) return res.json();
        var err = new Error('HTTP ' + res.status);
        err.transient = res.status === 429 || res.status === 502 || res.status === 503 || res.status === 504;
        err.rejected = res.status >= 400 && res.status < 500 && !err.transient;
        throw err;
      }, function () {
        var err = new Error('Netzwerk');
        err.transient = true;
        throw err;
      }).then(null, function (err) {
        if (err.transient && attempt < attempts) {
          return wait(Math.min(8000, 500 * Math.pow(2, attempt - 1))).then(run);
        }
        throw err;
      });
    }
    return run();
  }

  // Schreibende Aufrufe ersetzen immer einen kompletten Datensatz, Wiederholen ist deshalb unschädlich.
  function apiWrite(path, body) {
    writeSeq++;
    return apiRequest('PUT', path, body).then(function (data) {
      writeSeq++;
      return data;
    });
  }

  var Store = {
    loadBoard: function (dateKey) {
      return apiRequest('GET', '/api/board?date=' + dateKey, undefined, 3);
    },
    saveConfig: function (cfg) {
      return apiWrite('/api/config', { config: cfg }).then(function (r) { return r.config; });
    },
    saveDay: function (d) {
      return apiWrite('/api/days/' + d.date, { checked: d.checked, own: d.own }).then(function (r) { return r.day; });
    },
    saveMessage: function (m) {
      return apiWrite('/api/messages/' + m.date, { text: m.text }).then(function (r) { return r.message; });
    }
  };

  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function reportError(err) {
    toastEl.textContent = err && err.rejected
      ? 'Der Server hat die Änderung abgelehnt.'
      : 'Keine Verbindung zum Server, Änderung nicht gespeichert.';
    toastEl.style.display = 'block';
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.style.display = 'none'; }, 4000);
  }

  /* ============================================================
     Konstanten: Wochentage, Icons, Farben
     ============================================================ */
  var WEEKDAYS = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
  var WEEKDAY_ABBR = { mon: 'Mo', tue: 'Di', wed: 'Mi', thu: 'Do', fri: 'Fr', sat: 'Sa', sun: 'So' };
  var WEEKDAY_NAMES = { mon: 'Montag', tue: 'Dienstag', wed: 'Mittwoch', thu: 'Donnerstag', fri: 'Freitag', sat: 'Samstag', sun: 'Sonntag' };

  var ICON_CHOICES = ['lunchbox', 'bottle', 'shoes', 'jacket', 'toothbrush', 'backpack', 'homework',
    'table', 'room', 'pet', 'trash', 'laundry', 'pajamas', 'swim', 'sport',
    'lightoff', 'handwash', 'library', 'music', 'star', 'shower', 'owl', 'speaker'];

  // Standardname pro Icon, wenn ein Kind keinen Text eintippt (Sechsjaehriger)
  var ICON_LABELS = {
    lunchbox: 'Brotbox', bottle: 'Flasche', shoes: 'Schuhe', jacket: 'Jacke', toothbrush: 'Zähne',
    backpack: 'Ranzen', swim: 'Schwimmen', sport: 'Sport', homework: 'Hausaufgaben', table: 'Tisch',
    room: 'Zimmer', pet: 'Tier', trash: 'Müll', laundry: 'Wäsche', pajamas: 'Schlafanzug',
    lightoff: 'Licht aus', handwash: 'Hände', library: 'Buch', music: 'Musik', star: 'Aufgabe', shower: 'Duschen',
    owl: 'Duolingo', speaker: 'Hörbuch'
  };

  var AVATAR_CHOICES = ['fox', 'owl', 'dragon', 'cat', 'robot', 'dino', 'cactus', 'bear', 'block', 'pig', 'hero', 'shark'];
  // Gedaempfte Palette: das Tablet soll im Flur nicht schreien.
  var COLOR_CHOICES = ['salbei', 'staubblau', 'sand', 'mauve', 'terrakotta', 'olive', 'schiefer', 'rose', 'petrol', 'ocker'];

  var PALETTE = {
    salbei:     { day: '#9DB59A', night: '#7E937C' },
    staubblau:  { day: '#8FA9C2', night: '#73899E' },
    sand:       { day: '#D4B98A', night: '#AE9871' },
    mauve:      { day: '#B59BB3', night: '#927D91' },
    terrakotta: { day: '#C99A83', night: '#A57E6B' },
    olive:      { day: '#A8A96E', night: '#888A5A' },
    schiefer:   { day: '#8E9AA6', night: '#737D88' },
    rose:       { day: '#D0A3A6', night: '#A98487' },
    petrol:     { day: '#7FA8A4', night: '#688985' },
    ocker:      { day: '#C9A961', night: '#A48A50' }
  };


  // Die Config (Kinder, Aufgaben, Aktivitäten, Wochenplan, Zeiten) kommt ausschließlich vom Server.
  // Die Ausgangsdaten liegen in backend/priv/repo/seeds.exs.

  function freshDay(d, config) {
    var day = { date: todayKey(d), checked: {}, own: {} };
    for (var i = 0; i < config.kids.length; i++) {
      day.checked[config.kids[i].id] = {};
      day.own[config.kids[i].id] = [];
    }
    return day;
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function pad2(n) { return String(n).padStart(2, '0'); }

  /* ============================================================
     Zeitlogik
     ============================================================ */
  var sim = null; // { time: "HH:MM", day: "sat" } oder null, nur im Speicher

  function weekdayIndex(d) { return (d.getDay() + 6) % 7; }

  function now() {
    if (!sim) return new Date();
    var result = new Date();
    if (sim.time) {
      var parts = sim.time.split(':');
      var h = parseInt(parts[0], 10);
      var m = parseInt(parts[1], 10);
      if (!isNaN(h) && !isNaN(m)) result.setHours(h, m, 0, 0);
    }
    if (sim.day) {
      var targetIdx = WEEKDAYS.indexOf(sim.day);
      if (targetIdx >= 0) {
        var currentIdx = weekdayIndex(result);
        result.setDate(result.getDate() + (targetIdx - currentIdx));
      }
    }
    return result;
  }

  function todayKey(d) {
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function weekdayKeyOf(d) { return WEEKDAYS[weekdayIndex(d)]; }
  function minutesOfDate(d) { return d.getHours() * 60 + d.getMinutes(); }
  function minutesOfStr(hhmm) {
    var parts = String(hhmm || '00:00').split(':');
    var h = parseInt(parts[0], 10) || 0;
    var m = parseInt(parts[1], 10) || 0;
    return h * 60 + m;
  }
  function timeStr(d) { return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }

  // Drei Zeitraeume: morgens bis afternoonStartsAt, mittags bis eveningStartsAt, danach abends
  var PHASES = ['morning', 'afternoon', 'evening'];
  var PHASE_LABELS = { morning: 'Morgens', afternoon: 'Mittags', evening: 'Abends' };
  var PHASE_ICONS = { morning: 'sunrise', afternoon: 'sun', evening: 'moon' };
  function phaseFor(d, times) {
    var m = minutesOfDate(d);
    var afternoonAt = minutesOfStr(times.afternoonStartsAt || times.eveningStartsAt);
    var eveningAt = minutesOfStr(times.eveningStartsAt);
    if (m < afternoonAt) return 'morning';
    if (m < eveningAt) return 'afternoon';
    return 'evening';
  }
  function phaseIcon(phase) { return PHASE_ICONS[phase] || 'sun'; }
  function isNightFor(d, times) {
    var m = minutesOfDate(d);
    var nightStart = minutesOfStr(times.nightStartsAt);
    var morningStart = minutesOfStr(times.morningStartsAt);
    return m >= nightStart || m < morningStart;
  }
  function tomorrowKeyOf(weekdayKey) {
    var idx = WEEKDAYS.indexOf(weekdayKey);
    return WEEKDAYS[(idx + 1) % 7];
  }

  /* ============================================================
     Zustand
     ============================================================ */
  var config = null;
  var day = null;
  var message = null;
  var pending = {}; // 'kid:key' -> true, solange ein Haken auf Serverbestätigung wartet

  // Serverantwort (GET /api/board) in den lokalen Zustand übernehmen.
  // Ohne Config auf dem Server (Seeds fehlen) gibt es nichts zu zeigen: liefert false.
  function applyServerState(state) {
    if (!state.config) return false;
    config = state.config;
    day = state.day;
    message = state.message;
    ensureDayCurrent();
    return true;
  }

  function ensureDayCurrent() {
    var d = now();
    if (!day || day.date !== todayKey(d)) day = freshDay(d, config);
    // fehlende Kind-Eintraege nachziehen (falls Config sich geaendert hat)
    for (var i = 0; i < config.kids.length; i++) {
      var kid = config.kids[i].id;
      if (!day.checked[kid]) day.checked[kid] = {};
      if (!day.own[kid]) day.own[kid] = [];
    }
  }

  function cloneDay(d) { return JSON.parse(JSON.stringify(d)); }

  // Neuen Tageszustand an den Server schicken. Er gilt erst, wenn der Server bestätigt hat.
  // Während einer Simulation bleibt der Zustand nur im Speicher, der echte Tag bleibt unangetastet.
  function commitDay(next) {
    if (sim) {
      day = next;
      return Promise.resolve(day);
    }
    return Store.saveDay(next).then(function (saved) {
      day = saved;
      ensureDayCurrent();
      return day;
    });
  }

  // Nachricht speichern, gilt erst nach Serverbestätigung.
  function commitMessage(next) {
    Store.saveMessage(next).then(function (saved) {
      message = saved;
      render();
      renderParent();
    }, function (err) {
      reportError(err);
      renderParent();
    });
  }

  function setSim(next) {
    var wasSim = !!sim;
    sim = (next && (next.time || next.day)) ? next : null;
    if (sim && !wasSim) {
      day = freshDay(now(), config);
    } else if (!sim && wasSim) {
      day = null;
      refresh();
    }
    ensureDayCurrent();
  }

  // URL-Parameter fuer Tests. Die Simulation startet erst, wenn der Zustand geladen ist.
  var startSim = null;
  (function parseUrlParams() {
    try {
      var params = new URLSearchParams(location.search);
      var zeit = params.get('zeit');
      var tag = params.get('tag');
      if (zeit || tag) {
        var s = {};
        if (zeit) s.time = zeit;
        if (tag) s.day = tag;
        startSim = s;
      }
    } catch (e) {}
  })();
  var colState = {}; // pro Kid: { forceList: bool }
  var colTimers = {}; // pro Kid: setTimeout-Handle
  function initColumns() {
    for (var ci = 0; ci < config.kids.length; ci++) {
      colState[config.kids[ci].id] = { forceList: false };
      colTimers[config.kids[ci].id] = null;
    }
  }

  var lastToggled = null; // { kidId, key } für Pop-Animation
  var suppressClick = false;
  var pressTimer = null;
  var longPressTarget = null;

  var ownOverlayState = { kidId: null, icon: 'star' };
  var parentState = {
    open: false,
    section: 'message',
    messageDraft: '',
    wpKid: '',
    wpDay: weekdayKeyOf(now()),
    simTimeInput: '',
    simDayInput: ''
  };

  /* ============================================================
     Aufgaben-Ableitung
     ============================================================ */
  function accentColor(kid, night) {
    var pal = PALETTE[kid.color] || PALETTE[COLOR_CHOICES[0]];
    return night ? pal.night : pal.day;
  }

  function buildScheduledIds(kidId, wd, phase) {
    var sched = config.schedule[kidId];
    if (!sched || !sched[wd]) return [];
    var base = sched[wd][phase] ? sched[wd][phase].slice() : [];
    var actKeys = Object.keys(config.activities);
    if (phase === 'evening') {
      var tomorrow = tomorrowKeyOf(wd);
      var tomorrowActs = (sched[tomorrow] && sched[tomorrow].activities) || [];
      for (var i = 0; i < actKeys.length; i++) {
        if (tomorrowActs.indexOf(actKeys[i]) !== -1) {
          var beforeId = config.activities[actKeys[i]].eveningBefore;
          if (beforeId && base.indexOf(beforeId) === -1) base.push(beforeId);
        }
      }
    } else if (phase === 'morning') {
      var todayActs = (sched[wd] && sched[wd].activities) || [];
      for (var j = 0; j < actKeys.length; j++) {
        if (todayActs.indexOf(actKeys[j]) !== -1) {
          var morningId = config.activities[actKeys[j]].morning;
          if (morningId && base.indexOf(morningId) === -1) base.push(morningId);
        }
      }
    }
    return base.filter(function (id) { return !!config.tasks[id]; });
  }

  function buildListItems(kidId, phase, wd) {
    var items = [];
    var scheduled = buildScheduledIds(kidId, wd, phase);
    for (var i = 0; i < scheduled.length; i++) {
      var taskId = scheduled[i];
      var task = config.tasks[taskId];
      items.push({
        type: 'task',
        taskId: taskId,
        key: phase + ':' + taskId,
        icon: task.icon,
        label: task.label,
        short: task.short
      });
    }
    var ownList = day.own[kidId] || [];
    for (var j = 0; j < ownList.length; j++) {
      var o = ownList[j];
      if (o.phase === phase) {
        items.push({
          type: 'own',
          id: o.id,
          key: phase + ':own:' + o.id,
          icon: o.icon || 'star',
          label: o.label,
          short: o.label
        });
      }
    }
    return items;
  }

  function isChecked(kidId, key) {
    return !!(day.checked[kidId] && day.checked[kidId][key]);
  }

  // Haken setzen oder lösen. Gilt erst, wenn der Server bestätigt hat; solange ist die Zeile "pending".
  // Löst mit true auf, wenn sich etwas geändert hat.
  function toggleCheck(kidId, key) {
    var pendingKey = kidId + ':' + key;
    if (pending[pendingKey]) return Promise.resolve(false);
    var next = cloneDay(day);
    if (!next.checked[kidId]) next.checked[kidId] = {};
    var wasChecked = !!next.checked[kidId][key];
    if (wasChecked) delete next.checked[kidId][key]; else next.checked[kidId][key] = true;
    pending[pendingKey] = true;
    render();
    return commitDay(next).then(function () {
      delete pending[pendingKey];
      if (!wasChecked) lastToggled = { kidId: kidId, key: key };
      return true;
    }, function (err) {
      delete pending[pendingKey];
      reportError(err);
      render();
      return false;
    });
  }

      return '<svg class="' + cls + ' icon-svg ic-a ic-' + (ICON_COLORS[iconId] || 'weiss') + '" viewBox="0 0 48 48">' + ICON_PATHS[iconId] + '</svg>';

  function render() {
    var d = now();
    var night = isNightFor(d, config.times);
    appEl.className = night ? 'night' : '';
    if (night) ownOverlayEl.classList.add('night'); else ownOverlayEl.classList.remove('night');

    headerDateEl.textContent = d.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
    var phase = phaseFor(d, config.times);
    headerPhaseIconEl.querySelector('use').setAttribute('xlink:href', '#i-' + phaseIcon(phase));
    headerPhaseIconEl.querySelector('use').setAttribute('href', '#i-' + phaseIcon(phase));

    if (message && message.date === todayKey(d) && message.text) {
      headerMessageEl.textContent = message.text;
    } else {
      headerMessageEl.textContent = '';
    }

    var wd = weekdayKeyOf(d);
    var html = '';
    for (var i = 0; i < config.kids.length; i++) {
      var kid = config.kids[i];
      html += renderColumn(kid, phase, wd, night, i);
    }
    boardEl.innerHTML = html;

    if (lastToggled) {
      var sel = '.check[data-kid="' + lastToggled.kidId + '"][data-key="' + cssEscapeAttr(lastToggled.key) + '"]';
      var node = boardEl.querySelector(sel);
      if (node) node.className += ' pop';
      lastToggled = null;
    }

    for (var pk in pending) {
      var pi = pk.indexOf(':');
      var pnode = boardEl.querySelector('.check[data-kid="' + pk.slice(0, pi) + '"][data-key="' + cssEscapeAttr(pk.slice(pi + 1)) + '"]');
      while (pnode && pnode !== boardEl && !/(^| )(tile|task-row)( |$)/.test(pnode.className || '')) pnode = pnode.parentNode;
      if (pnode && pnode !== boardEl) pnode.className += ' pending';
    }

    if (sim) {
      simLabelEl.style.display = 'block';
      simLabelEl.textContent = 'Simulation: ' + WEEKDAY_ABBR[wd] + ' ' + timeStr(d) + ' (Haken werden nicht gespeichert)';
    } else {
      simLabelEl.style.display = 'none';
    }
  }

  function cssEscapeAttr(s) {
    return String(s).replace(/"/g, '\\"');
  }

  function renderColumn(kid, phase, wd, night, index) {
    var accent = accentColor(kid, night);
    var items = buildListItems(kid.id, phase, wd);
    var bodyHtml;

    if (items.length === 0) {
      bodyHtml = '<div class="empty-view">' +
        iconUse('star', 'empty-icon') +
        '<div class="empty-text">Heute nichts zu tun</div>' +
        '</div>';
      colState[kid.id].forceList = false;
      clearColTimer(kid.id);
    } else {
      var allChecked = true;
      for (var i = 0; i < items.length; i++) {
        if (!isChecked(kid.id, items[i].key)) { allChecked = false; break; }
      }
      if (allChecked && !colState[kid.id].forceList) {
        clearColTimer(kid.id);
        bodyHtml = renderDoneView(kid, phase);
      } else if (allChecked && colState[kid.id].forceList) {
        startColTimer(kid.id);
        bodyHtml = renderTaskListBody(kid, items);
      } else {
        colState[kid.id].forceList = false;
        clearColTimer(kid.id);
        bodyHtml = renderTaskListBody(kid, items);
      }
    }

    var colClass = 'column' + (index > 0 ? ' col-2' : '');

  function startColTimer(kidId) {

    colTimers[kidId] = setTimeout(function () {

  /* ============================================================
     Feiersound (Web Audio, synthetisiert, keine Datei)
     ============================================================ */
  var audioCtx = null;
  var audioUnlocked = false;
  function unlockAudio() {
    // iOS gibt Ton nur frei, wenn innerhalb einer Beruehrung ein Puffer gestartet wird.
    // resume() allein reicht auf iOS 12 nicht. Deshalb bei jeder Beruehrung ein stiller Puffer.
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state !== 'running' && audioCtx.resume) audioCtx.resume();
      if (!audioUnlocked) {
        var buf = audioCtx.createBuffer(1, 1, 22050);
        var src = audioCtx.createBufferSource();
        src.buffer = buf;
        src.connect(audioCtx.destination);
        if (src.start) src.start(0); else if (src.noteOn) src.noteOn(0);
        audioUnlocked = true;
      }
    } catch (e) {}
  }
  function playDoneChime() {
    if (config.sound === false) return;
    unlockAudio();
    if (!audioCtx) return;
    try {
      var t0 = audioCtx.currentTime + 0.03;
      var notes = [523.25, 659.25, 783.99, 1046.5];
      for (var i = 0; i < notes.length; i++) {
        var osc = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = notes[i];
        var t = t0 + i * 0.13;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.16, t + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.6);
      }
    } catch (e) {}
  }
  function columnComplete(kidId) {
    var kid = null;
    for (var i = 0; i < config.kids.length; i++) if (config.kids[i].id === kidId) kid = config.kids[i];
    if (!kid) return false;
    var d = now();
    var items = buildListItems(kidId, phaseFor(d, config.times), weekdayKeyOf(d));
    if (!items.length) return false;
    for (var j = 0; j < items.length; j++) if (!isChecked(kidId, items[j].key)) return false;
    return true;
  }

  /* ============================================================
     Board: Klicks / Touch
     ============================================================ */
  function closestWithRole(el) {
    while (el && el !== boardEl) {
      if (el.getAttribute && el.getAttribute('data-role')) return el;
      el = el.parentNode;
    }
    return null;
  }
  function closestPressable(el) {
    while (el && el !== boardEl) {
      if (el.classList && (el.classList.contains('tile') || el.classList.contains('task-row') || el.classList.contains('done-view'))) return el;
      el = el.parentNode;
    }
    return null;
  }

  boardEl.addEventListener('touchstart', onBoardPressStart, { passive: true });
  boardEl.addEventListener('mousedown', onBoardPressStart);
  boardEl.addEventListener('touchend', onBoardPressEnd);
  boardEl.addEventListener('touchmove', onBoardPressCancel);
  boardEl.addEventListener('touchcancel', onBoardPressCancel);
  boardEl.addEventListener('mouseup', onBoardPressEnd);
  boardEl.addEventListener('mouseleave', onBoardPressCancel);
  boardEl.addEventListener('click', onBoardClick);

  function onBoardPressStart(e) {
    var target = e.target;
    var pressable = closestPressable(target);
    if (pressable) pressable.classList.add('pressed');

    var roleEl = closestWithRole(target);
    if (roleEl && roleEl.getAttribute('data-own-id')) {
      longPressTarget = roleEl;
      pressTimer = setTimeout(function () {
        triggerOwnDelete(roleEl);
        pressTimer = null;
      }, 1500);
    }
  }
  function onBoardPressEnd() {
    unlockAudio();
    clearPressState();
  }
  function onBoardPressCancel() {
    clearPressState();
  }
  function clearPressState() {
    var pressed = boardEl.querySelectorAll('.pressed');
    for (var i = 0; i < pressed.length; i++) pressed[i].classList.remove('pressed');
    if (pressTimer) {
      clearTimeout(pressTimer);
      pressTimer = null;
    }
    longPressTarget = null;
  }

  function triggerOwnDelete(el) {
    suppressClick = true;
    el.style.transition = 'opacity 250ms ease, transform 250ms ease';
    el.style.opacity = '0';
    el.style.transform = 'scale(0.9)';
    var kidId = el.getAttribute('data-kid');
    var ownId = el.getAttribute('data-own-id');
    setTimeout(function () {
      var next = cloneDay(day);
      var list = next.own[kidId] || [];
      next.own[kidId] = list.filter(function (o) { return o.id !== ownId; });
      commitDay(next).then(render, function (err) { reportError(err); render(); });
    }, 250);
  }

  function onBoardClick(e) {
    if (suppressClick) {
      suppressClick = false;
      return;
    }
    var roleEl = closestWithRole(e.target);
    if (!roleEl) return;
    var role = roleEl.getAttribute('data-role');
    var kidId = roleEl.getAttribute('data-kid');
    if (role === 'task-toggle') {
      var key = roleEl.getAttribute('data-key');
      unlockAudio();
      var wasComplete = columnComplete(kidId);
      toggleCheck(kidId, key).then(function (changed) {
        if (!changed) return;
        if (!wasComplete && columnComplete(kidId)) playDoneChime();
        render();
      });
    } else if (role === 'add-own') {
      openOwnOverlay(kidId);
    } else if (role === 'peek') {
      colState[kidId].forceList = true;
      render();
    }
  }

  /* ============================================================
     Eigene-Aufgabe-Overlay
     ============================================================ */
  var ownOverlayEl = document.getElementById('own-overlay');
  var ownIconGridEl = document.getElementById('own-icon-grid');
  var ownTextInputEl = document.getElementById('own-text-input');

  function openOwnOverlay(kidId) {
    ownOverlayState.kidId = kidId;
    ownOverlayState.icon = 'star';
    ownTextInputEl.value = '';
    renderOwnIconGrid();
    ownOverlayEl.classList.add('open');
    var kid = null;
    for (var i = 0; i < config.kids.length; i++) if (config.kids[i].id === kidId) kid = config.kids[i];
    if (kid && kid.literacy === 'text') setTimeout(function () { ownTextInputEl.focus(); }, 50);
  }
  function closeOwnOverlay() {
    ownOverlayEl.classList.remove('open');
  }
  function renderOwnIconGrid() {
    var html = '';
    for (var i = 0; i < ICON_CHOICES.length; i++) {
      var ic = ICON_CHOICES[i];
      html += '<div class="icon-pick' + (ic === ownOverlayState.icon ? ' selected' : '') + '" data-icon="' + ic + '">' +
        iconUse(ic, '') + '</div>';
    }
    ownIconGridEl.innerHTML = html;
  }
  ownIconGridEl.addEventListener('click', function (e) {
    var el = e.target;
    while (el && el !== ownIconGridEl) {
      if (el.getAttribute && el.getAttribute('data-icon')) {
        ownOverlayState.icon = el.getAttribute('data-icon');
        renderOwnIconGrid();
        return;
      }
      el = el.parentNode;
    }
  });
  document.getElementById('own-cancel-btn').addEventListener('click', closeOwnOverlay);
  document.getElementById('own-done-btn').addEventListener('click', function () {
    var text = ownTextInputEl.value.replace(/\s+/g, ' ').trim();
    if (!ownOverlayState.kidId) { closeOwnOverlay(); return; }
    if (!text) text = ICON_LABELS[ownOverlayState.icon] || 'Aufgabe';
    var kidId = ownOverlayState.kidId;
    var d = now();
    var phase = phaseFor(d, config.times);
    var next = cloneDay(day);
    if (!next.own[kidId]) next.own[kidId] = [];
    next.own[kidId].push({
      id: 'o' + Date.now() + Math.floor(Math.random() * 1000),
      phase: phase,
      label: text.slice(0, 40),
      icon: ownOverlayState.icon
    });
    closeOwnOverlay();
    commitDay(next).then(render, function (err) { reportError(err); render(); });
  });

  /* ============================================================
     Ecke: Elternbereich öffnen
     ============================================================ */
  var cornerEl = document.getElementById('corner-hit');
  var cornerTimer = null;
  var cornerStart = null;
  // iOS: Ein langer Fingerdruck loest sonst die System-Geste (Lupe, Callout) aus und bricht den Touch ab.
  // Deshalb touchstart nicht passiv und preventDefault. Kleine Fingerbewegungen werden toleriert.
  cornerEl.addEventListener('touchstart', function (e) {
    if (e.cancelable) e.preventDefault();
    var t = e.touches && e.touches[0];
    cornerStart = t ? { x: t.clientX, y: t.clientY } : null;
    startCornerTimer();
  }, { passive: false });
  cornerEl.addEventListener('mousedown', function (e) {
    if (e.button !== 0) return;
    e.preventDefault();
    cornerStart = { x: e.clientX, y: e.clientY };
    startCornerTimer();
  });
  cornerEl.addEventListener('touchmove', function (e) {
    var t = e.touches && e.touches[0];
    if (cornerStart && t && (Math.abs(t.clientX - cornerStart.x) > 14 || Math.abs(t.clientY - cornerStart.y) > 14)) cancelCornerTimer();
  }, { passive: true });
  cornerEl.addEventListener('touchend', cancelCornerTimer);
  cornerEl.addEventListener('touchcancel', cancelCornerTimer);
  cornerEl.addEventListener('mouseup', cancelCornerTimer);
  cornerEl.addEventListener('mouseleave', cancelCornerTimer);
  cornerEl.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // Fuer den Test am Rechner: Taste Shift+E oder ?eltern=1 in der Adresse
  document.addEventListener('keydown', function (e) {
    if ((e.key === 'E' || e.key === 'e' || e.code === 'KeyE') && e.shiftKey && !e.metaKey && !e.ctrlKey && !e.altKey) {
      var tag = (e.target && e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea') return;
      e.preventDefault();
      openParent();
    }
  });

  // Alternative zum Langdruck: fuenfmal innerhalb von 2,5 Sekunden auf das Datum tippen
  var dateTaps = [];
  document.getElementById('header').addEventListener('click', function (e) {
    var el = e.target;
    var hit = false;
    while (el && el.id !== 'header') {
      if (el.id === 'header-date' || el.id === 'header-phase-icon') { hit = true; break; }
      el = el.parentNode;
    }
    if (!hit) return;
    var t = Date.now();
    dateTaps.push(t);
    dateTaps = dateTaps.filter(function (x) { return t - x < 2500; });
    if (dateTaps.length >= 5) {
      dateTaps = [];
      openParent();
    }
  });

  function startCornerTimer() {
    cancelCornerTimer();
    cornerEl.classList.add('arming');
    cornerTimer = setTimeout(function () {
      cornerTimer = null;
      cornerEl.classList.remove('arming');
      openParent();
    }, 3000);
  }
  function cancelCornerTimer() {
    cornerEl.classList.remove('arming');
    cornerStart = null;
    if (cornerTimer) {
      clearTimeout(cornerTimer);
      cornerTimer = null;
    }
  }

  /* ============================================================
     Elternbereich
     ============================================================ */
  var parentOverlayEl = document.getElementById('parent-overlay');
  var parentNavEl = document.getElementById('parent-nav');
  var parentContentEl = document.getElementById('parent-content');

  var SECTIONS = [
    { id: 'message', label: 'Nachricht' },
    { id: 'schedule', label: 'Wochenplan' },
    { id: 'tasks', label: 'Aufgaben' },
    { id: 'kids', label: 'Kinder' },
    { id: 'times', label: 'Zeiten' },
    { id: 'preview', label: 'Vorschau' }
  ];

  function openParent() {
    if (!config) return; // noch nicht geladen
    var d = now();
    if (message && message.date === todayKey(d)) {
      parentState.messageDraft = message.text || '';
    } else {
      parentState.messageDraft = '';
    }
    parentState.wpDay = weekdayKeyOf(d);
    parentState.simTimeInput = sim && sim.time ? sim.time : '';
    parentState.simDayInput = sim && sim.day ? sim.day : '';
    parentOverlayEl.classList.add('open');
    renderParent();
  }
  function closeParent() {
    parentOverlayEl.classList.remove('open');
    render();
  }

  function renderParent() {
    var navHtml = '';
    for (var i = 0; i < SECTIONS.length; i++) {
      var s = SECTIONS[i];
      navHtml += '<button data-section="' + s.id + '" class="' + (parentState.section === s.id ? 'active' : '') + '">' + esc(s.label) + '</button>';
    }
    navHtml += '<div class="nav-spacer"></div>';
    navHtml += '<button class="nav-back" data-action="back-to-board">Zurück zum Board</button>';
    parentNavEl.innerHTML = navHtml;

    var content = '';
    if (parentState.section === 'message') content = renderSectionMessage();
    else if (parentState.section === 'schedule') content = renderSectionSchedule();
    else if (parentState.section === 'tasks') content = renderSectionTasks();
    else if (parentState.section === 'kids') content = renderSectionKids();
    else if (parentState.section === 'times') content = renderSectionTimes();
    else if (parentState.section === 'preview') content = renderSectionPreview();
    parentContentEl.innerHTML = content;

    bindSectionEvents();
  }

  parentNavEl.addEventListener('click', function (e) {
    var el = e.target;
    while (el && el !== parentNavEl) {
      if (el.getAttribute && el.getAttribute('data-section')) {
        parentState.section = el.getAttribute('data-section');
        renderParent();
        return;
      }
      if (el.getAttribute && el.getAttribute('data-action') === 'back-to-board') {
        closeParent();
        return;
      }
      el = el.parentNode;
    }
  });

  function renderSectionKids() {

      out += '<div style="border-bottom:1px solid #D8D4CB;padding:16px 0">';

      out += '</div></div>';
      out += '<div class="p-field"><label>Lesestufe</label><div class="p-row">' +
        '<button class="p-btn' + (kid.literacy === 'icons' ? ' active' : '') + '" data-action="kid-literacy" data-kid="' + kid.id + '" data-lit="icons">Icons</button>' +
        '<button class="p-btn' + (kid.literacy === 'text' ? ' active' : '') + '" data-action="kid-literacy" data-kid="' + kid.id + '" data-lit="text">Text</button>' +
        '</div></div>';
      out += '<div class="p-field"><label>Darf eigene Aufgaben anlegen</label>' +
        '<button class="p-btn' + (kid.canAddOwn ? ' active' : '') + '" data-action="kid-addown" data-kid="' + kid.id + '">' + (kid.canAddOwn ? 'An' : 'Aus') + '</button></div>';
      out += '</div>';
    }
    return out;
  }

  /* ---------- 5. Zeiten ---------- */
  function renderSectionTimes() {
    return '<h2>Zeiten</h2>' +
      '<div class="p-field"><label>Mittagsliste ab</label><input type="time" id="p-time-afternoon" value="' + esc(config.times.afternoonStartsAt || '12:00') + '"></div>' +
      '<div class="p-field"><label>Abendliste ab</label><input type="time" id="p-time-evening" value="' + esc(config.times.eveningStartsAt) + '"></div>' +
      '<div class="p-field"><label>Nachtmodus ab</label><input type="time" id="p-time-night-start" value="' + esc(config.times.nightStartsAt) + '"></div>' +
      '<div class="p-field"><label>Nachtmodus bis</label><input type="time" id="p-time-night-end" value="' + esc(config.times.morningStartsAt) + '"></div>' +
      '<h2 style="margin-top:28px">Feiersound</h2>' +
      '<div class="p-field"><label><input type="checkbox" id="p-sound"' + (config.sound !== false ? ' checked' : '') + '> Kurzer Klang, wenn eine Spalte fertig ist</label></div>' +
      '<p class="p-hint">Beim Einschalten spielt der Klang einmal zur Probe. Auf dem iPad muss der Stummschalter aus sein.</p>';
  }

  /* ---------- 6. Vorschau ---------- */
  function renderSectionPreview() {
    var out = '<h2>Vorschau</h2>';
    out += '<div class="p-field"><label>Uhrzeit simulieren</label><input type="time" id="p-sim-time" value="' + esc(parentState.simTimeInput) + '"></div>';
    out += '<div class="p-field"><label>Wochentag simulieren</label><select id="p-sim-day">';
    out += '<option value="">(echter Wochentag)</option>';
    for (var i = 0; i < WEEKDAYS.length; i++) {
      var wd = WEEKDAYS[i];
      out += '<option value="' + wd + '"' + (parentState.simDayInput === wd ? ' selected' : '') + '>' + WEEKDAY_NAMES[wd] + '</option>';
    }
    out += '</select></div>';
    out += '<button class="p-btn" data-action="sim-off">Simulation aus</button>';
    if (sim) {
      var d = now();
      out += '<div class="p-hint">Gerade simuliert: ' + WEEKDAY_ABBR[weekdayKeyOf(d)] + ' ' + timeStr(d) + '</div>';
    }
    return out;
  }

  /* ---------- Event-Bindung Inhalt ---------- */
  function bindSectionEvents() {
    parentContentEl.onclick = function (e) {
      var el = e.target;
      while (el && el !== parentContentEl) {
        var action = el.getAttribute && el.getAttribute('data-action');
        if (action) { handleParentAction(action, el); return; }
        el = el.parentNode;
      }
    };
    parentContentEl.onchange = function (e) {
      var el = e.target;
      var action = el.getAttribute && el.getAttribute('data-action');
      if (action) handleParentChange(action, el);
      else if (el.id === 'p-time-afternoon') { if (el.value) { config.times.afternoonStartsAt = el.value; saveConfigAndBoard(); } }
      else if (el.id === 'p-time-evening') { if (el.value) { config.times.eveningStartsAt = el.value; saveConfigAndBoard(); } }
      else if (el.id === 'p-time-night-start') { if (el.value) { config.times.nightStartsAt = el.value; saveConfigAndBoard(); } }
      else if (el.id === 'p-time-night-end') { if (el.value) { config.times.morningStartsAt = el.value; saveConfigAndBoard(); } }
      else if (el.id === 'p-sound') { config.sound = !!el.checked; saveConfigAndBoard(); if (config.sound) playDoneChime(); }
      else if (el.id === 'p-sim-time') { parentState.simTimeInput = el.value; applySimFromInputs(); }
      else if (el.id === 'p-sim-day') { parentState.simDayInput = el.value; applySimFromInputs(); }
    };
    parentContentEl.oninput = function (e) {
      var el = e.target;
      if (el.id === 'p-message-text') parentState.messageDraft = el.value;
    };
    var newIconGrid = document.getElementById('new-task-icon-grid');
    if (newIconGrid) {
      newIconGrid.addEventListener('click', function (e) {
        var el = e.target;
        while (el && el !== newIconGrid) {
          if (el.getAttribute && el.getAttribute('data-newicon')) {
            newTaskState.icon = el.getAttribute('data-newicon');
            renderParent();
            return;
          }
          el = el.parentNode;
        }
      });
    }
  }

  // Config-Änderungen gelten sofort lokal (Tippen im Elternbereich darf nicht warten)
  // und werden im Hintergrund gespeichert. Scheitert das, kommt ein Hinweis.
  function saveConfigAndBoard() {
    Store.saveConfig(config).then(null, reportError);
    render();
  }

  function applySimFromInputs() {
    var t = parentState.simTimeInput;
    var wd = parentState.simDayInput;
    var next = {};
    if (t) next.time = t;
    if (wd) next.day = wd;
    setSim(next);
    render();
    renderParent();
  }

  function handleParentChange(action, el) {
    if (action === 'wp-task') {
      var taskId = el.getAttribute('data-task');
      var phase = el.getAttribute('data-phase');
      var arr = config.schedule[parentState.wpKid][parentState.wpDay][phase] || [];
      var set = {};
      for (var i = 0; i < arr.length; i++) set[arr[i]] = true;
      if (el.checked) set[taskId] = true; else delete set[taskId];
      var order = Object.keys(config.tasks);
      var next = [];
      for (var j = 0; j < order.length; j++) if (set[order[j]]) next.push(order[j]);
      config.schedule[parentState.wpKid][parentState.wpDay][phase] = next;
      saveConfigAndBoard();
      renderParent();
    } else if (action === 'wp-activity') {
      var actId = el.getAttribute('data-act');
      var actArr = config.schedule[parentState.wpKid][parentState.wpDay].activities;
      var actSet = {};
      for (var k = 0; k < actArr.length; k++) actSet[actArr[k]] = true;
      if (el.checked) actSet[actId] = true; else delete actSet[actId];
      var actOrder = Object.keys(config.activities);
      var actNext = [];
      for (var m = 0; m < actOrder.length; m++) if (actSet[actOrder[m]]) actNext.push(actOrder[m]);
      config.schedule[parentState.wpKid][parentState.wpDay].activities = actNext;
      saveConfigAndBoard();
      renderParent();
    } else if (action === 'kid-name') {
      var kidId = el.getAttribute('data-kid');
      setKidField(kidId, 'name', el.value.slice(0, 20));
    }
  }

  function setKidField(kidId, field, value) {
    for (var i = 0; i < config.kids.length; i++) {
      if (config.kids[i].id === kidId) config.kids[i][field] = value;
    }
    saveConfigAndBoard();
  }

  function handleParentAction(action, el) {
    if (action === 'msg-show') {
      var text = parentState.messageDraft.replace(/\s+/g, ' ').trim().slice(0, 80);
      commitMessage({ date: todayKey(now()), text: text });
    } else if (action === 'msg-clear') {
      parentState.messageDraft = '';
      commitMessage({ date: todayKey(now()), text: '' });
    } else if (action === 'wp-kid') {
      parentState.wpKid = el.getAttribute('data-kid');
      renderParent();
    } else if (action === 'wp-day') {
      parentState.wpDay = el.getAttribute('data-day');
      renderParent();
    } else if (action === 'wp-copy-weekdays') {
      var srcDay = config.schedule[parentState.wpKid][parentState.wpDay];
      var targets = ['mon', 'tue', 'wed', 'thu', 'fri'];
      for (var t = 0; t < targets.length; t++) {
        if (targets[t] === parentState.wpDay) continue;
        var dst = config.schedule[parentState.wpKid][targets[t]];
        for (var q = 0; q < PHASES.length; q++) dst[PHASES[q]] = (srcDay[PHASES[q]] || []).slice();
      }
      saveConfigAndBoard();
      renderParent();
    } else if (action === 'task-delete') {
      var taskId = el.getAttribute('data-task');
      delete config.tasks[taskId];
      var actIds = Object.keys(config.activities);
      for (var a = 0; a < actIds.length; a++) {
        if (config.activities[actIds[a]].morning === taskId) config.activities[actIds[a]].morning = null;
        if (config.activities[actIds[a]].eveningBefore === taskId) config.activities[actIds[a]].eveningBefore = null;
      }
      var kidsIds = Object.keys(config.schedule);
      for (var i = 0; i < kidsIds.length; i++) {
        for (var w = 0; w < WEEKDAYS.length; w++) {
          var dayObj = config.schedule[kidsIds[i]][WEEKDAYS[w]];
          dayObj.morning = dayObj.morning.filter(function (id) { return id !== taskId; });
          dayObj.evening = dayObj.evening.filter(function (id) { return id !== taskId; });
        }
      }
      saveConfigAndBoard();
      renderParent();
    } else if (action === 'task-add') {
      var labelEl = document.getElementById('new-task-label');
      var shortEl = document.getElementById('new-task-short');
      var label = labelEl.value.replace(/\s+/g, ' ').trim();
      var shortText = shortEl.value.replace(/\s+/g, ' ').trim();
      if (label && shortText) {
        var id = 't' + Date.now();
        config.tasks[id] = { label: label.slice(0, 60), short: shortText.slice(0, 20), icon: newTaskState.icon };
        newTaskState = { icon: 'star', label: '', short: '' };
        saveConfigAndBoard();
      }
      renderParent();
    } else if (action === 'kid-avatar') {
      setKidField(el.getAttribute('data-kid'), 'avatar', el.getAttribute('data-avatar'));
      renderParent();
    } else if (action === 'kid-color') {
      setKidField(el.getAttribute('data-kid'), 'color', el.getAttribute('data-color'));
      renderParent();
    } else if (action === 'kid-literacy') {
      setKidField(el.getAttribute('data-kid'), 'literacy', el.getAttribute('data-lit'));
      renderParent();
    } else if (action === 'kid-addown') {
      var kidId = el.getAttribute('data-kid');
      var kid = null;
      for (var k = 0; k < config.kids.length; k++) if (config.kids[k].id === kidId) kid = config.kids[k];
      setKidField(kidId, 'canAddOwn', !kid.canAddOwn);
      renderParent();
    } else if (action === 'sim-off') {
      setSim(null);
      parentState.simTimeInput = '';
      parentState.simDayInput = '';
      render();
      renderParent();
    }
  }

  /* ============================================================
     Uhr-Intervall
     ============================================================ */
  // Zustand vom Server holen (Nachricht vom Handy, Haken, Config-Änderungen).
  // Antworten, die von einem Schreibvorgang überholt wurden, werden verworfen.
  function refresh() {
    var seq = writeSeq;
    return Store.loadBoard(todayKey(now())).then(function (state) {
      if (seq !== writeSeq || sim) return;
      if (applyServerState(state)) render();
    }, function () {});
  }

  // Alle 30 Sekunden: Datumswechsel prüfen, Server fragen, neu zeichnen.
  // Um 03:00 lädt sich die Seite einmal neu (nur wenn sie schon länger als eine Stunde läuft).
  var bootedAt = Date.now();
  function tick() {
    ensureDayCurrent();
    render();
    if (!sim) refresh();

    var real = new Date();
    var upForAnHour = Date.now() - bootedAt > 60 * 60 * 1000;
    if (!sim && real.getHours() === 3 && real.getMinutes() === 0 && upForAnHour) location.reload();
  }

  /* ============================================================
     Start: erst laden, dann zeichnen. Bis dahin steht der Ladezustand im Bild.
     Ohne Verbindung wird mit wachsendem Abstand weiter versucht.
     ============================================================ */
  var loadingEl = document.getElementById('loading');
  function boot(attempt) {
    Store.loadBoard(todayKey(now())).then(function (state) {
      if (!applyServerState(state)) {
        var unconfigured = new Error('Keine Config auf dem Server');
        unconfigured.unconfigured = true;
        throw unconfigured;
      }
      if (startSim) setSim(startSim);
      initColumns();
      parentState.wpKid = config.kids[0].id;
      loadingEl.style.display = 'none';
      render();
      if (urlParam('eltern') === '1') setTimeout(openParent, 100);
      setInterval(tick, 30000);
    }, function (err) {
      loadingEl.textContent = err && err.unconfigured
        ? 'Der Server ist noch nicht eingerichtet, neuer Versuch…'
        : 'Keine Verbindung zum Server, neuer Versuch…';
      setTimeout(function () { boot(attempt + 1); }, Math.min(10000, 1000 * Math.pow(2, attempt)));
    });
  }
  boot(0);
})();
</script>
</body>
