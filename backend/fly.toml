app = "homebase-api"

[build]
  dockerfile = "./Dockerfile"

[env]
  PHX_SERVER = "true"
  PHX_HOST = "homebase-api.fly.dev"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "stop"
  min_machines_running = 0
  max_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[deploy]
  release_command = "/app/bin/homebase eval 'Homebase.Release.migrate'"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
