name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the built image to Bunny
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Backend tests and SPA lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIX_ENV: test
      TEST_DATABASE_URL: ecto://postgres:postgres@localhost/homebase_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir and OTP from .tool-versions
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            backend/deps
            backend/_build
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions', 'backend/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix test

      - name: Deployment checks
        working-directory: .
        run: |
          sh -n backend/rel/start.sh
          python3 -m unittest discover -s scripts/tests

      # Safari 12 auf dem iPad: keine moderne Syntax im Prototyp
      - name: SPA lint (Safari 12) and syntax check
        working-directory: .
        run: |
          if grep -nE '\?\.|\?\?|Object\.fromEntries|replaceAll' src/index.html; then
            echo "Syntax gefunden, die Safari 12 nicht kann"; exit 1
          fi
          python3 -c "import re;s=open('src/index.html',encoding='utf-8').read();open('/tmp/flur.js','w',encoding='utf-8').write(re.search(r'<script>(.*)</script>',s,re.S).group(1))"
          node --check /tmp/flur.js

  image:
    name: Build backend image
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: backend
          push: true
          platforms: linux/amd64
          tags: ghcr.io/julelabs/homebase-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy backend to Bunny
    needs: image
    if: github.event_name == 'push' || inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: bunny-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @bunny.net/cli@0.19.0
      - name: Deploy and verify
        env:
          BUNNYNET_API_KEY: ${{ secrets.BUNNYNET_API_KEY }}
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: python3 scripts/deploy.py
